[project]
name = "backend"
version = "0.1.0"
description = "Zijing Cup Analysis backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.39",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Local stdio MCP server (app/mcp_server.py) + its tests. Never imported by
    # app.main, so it stays out of prod deps — Render does not need it. Pinned
    # <2 for the FastMCP decorator API (2.x renamed it to MCPServer).
    "mcp<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
